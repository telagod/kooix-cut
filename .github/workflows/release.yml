name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: kooix-cut-linux-x86_64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kooix-cut-macos-aarch64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kooix-cut-windows-x86_64
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p kooix-cli

      - name: Rename (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/kooix-cut ${{ matrix.artifact }}

      - name: Rename (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/kooix-cut.exe ${{ matrix.artifact }}${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.ext }}

  build-gui:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        working-directory: ui
        run: npm install

      - name: Build Tauri
        working-directory: ui
        run: npx tauri build

      - name: List bundle output
        shell: bash
        run: find . -path "*/bundle/*" -type f | sort

      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p gui-artifacts
          find . -name "*.deb" -path "*/bundle/*" -exec cp {} gui-artifacts/kooix-cut-${{ matrix.suffix }}.deb \;
          find . -name "*.AppImage" -path "*/bundle/*" -exec cp {} gui-artifacts/kooix-cut-${{ matrix.suffix }}.AppImage \;

      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p gui-artifacts
          find . -name "*.dmg" -path "*/bundle/*" -exec cp {} gui-artifacts/kooix-cut-${{ matrix.suffix }}.dmg \;

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p gui-artifacts
          find . -name "*.msi" -path "*/bundle/*" -exec cp {} gui-artifacts/kooix-cut-${{ matrix.suffix }}.msi \;
          find . -name "*.exe" -path "*/bundle/nsis/*" -exec cp {} gui-artifacts/kooix-cut-${{ matrix.suffix }}-setup.exe \;

      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.suffix }}
          path: gui-artifacts/

  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install frontend deps
        working-directory: ui
        run: npm install

      - name: Init Android project
        working-directory: ui
        run: npx tauri android init
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Build Android APK
        working-directory: ui
        run: npx tauri android build --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Find and rename APK
        run: |
          APK=$(find ui/src-tauri/gen/android -name "*.apk" -type f | head -1)
          cp "$APK" kooix-cut-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kooix-cut-android
          path: kooix-cut-android-arm64.apk

  release:
    needs: [build-cli, build-gui, build-android]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.build-cli.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: List artifacts
        run: find . -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            kooix-cut-linux-x86_64/*
            kooix-cut-macos-aarch64/*
            kooix-cut-windows-x86_64/*
            gui-linux-x86_64/*
            gui-macos-aarch64/*
            gui-windows-x86_64/*
            kooix-cut-android/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
