<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kooix Cut</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 动态背景光斑 -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="toolbar glass-animate-in">
    <h1>✂️ Kooix Cut</h1>
    <div class="toolbar-actions">
      <button class="glass-btn icon-btn" id="btn-theme" title="切换深浅色" aria-label="切换深浅色">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.17 3.17l1.06 1.06M11.77 11.77l1.06 1.06M3.17 12.83l1.06-1.06M11.77 4.23l1.06-1.06"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.36 10.18A5.5 5.5 0 015.82 2.64a6.5 6.5 0 107.54 7.54z"/></svg>
      </button>
      <button class="glass-btn icon-btn" id="btn-clear" title="清空文件列表">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M5.33 4V2.67a1.33 1.33 0 011.34-1.34h2.66a1.33 1.33 0 011.34 1.34V4m2 0v9.33a1.33 1.33 0 01-1.34 1.34H4.67a1.33 1.33 0 01-1.34-1.34V4h9.34z"/></svg>
      </button>
    </div>
  </div>

  <div class="main">
    <!-- Drop Zone + File List -->
    <div class="glass-card glass-animate-in" style="animation-delay:50ms" id="card-files">
      <div class="drop-zone" id="drop-zone">
        <div class="drop-zone-ring">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5">
            <path d="M42 30v8a4 4 0 01-4 4H10a4 4 0 01-4-4v-8M34 16l-10-10-10 10M24 6v28"/>
          </svg>
        </div>
        <div class="drop-zone-text">拖拽视频文件到此处</div>
        <div class="drop-zone-hint">或 <button class="link-btn" id="btn-browse">选择目录</button></div>
      </div>
      <div class="file-section" id="file-section" style="display:none">
        <div class="file-header">
          <span class="file-count" id="file-count"></span>
          <button class="link-btn" id="btn-add-more">+ 添加更多</button>
        </div>
        <ul class="file-list" id="file-list"></ul>
      </div>
    </div>

    <!-- Settings -->
    <div class="glass-card glass-animate-in" style="animation-delay:100ms">
      <div class="settings-toggle" id="settings-toggle">
        <span>⚙️ 参数设置</span>
        <span class="arrow" id="settings-arrow">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4.5l3 3 3-3"/></svg>
        </span>
      </div>
      <div class="settings-body" id="settings-body">
        <div class="settings-grid">
          <div class="field">
            <label for="threshold">静音阈值</label>
            <div class="input-wrap">
              <input type="range" id="threshold-range" min="0.001" max="0.1" step="0.001" value="0.01" />
              <input type="number" id="threshold" value="0.01" min="0.001" max="1" step="0.001" />
            </div>
          </div>
          <div class="field">
            <label for="min-duration">最小时长 (秒)</label>
            <div class="input-wrap">
              <input type="range" id="duration-range" min="0.5" max="30" step="0.5" value="3.0" />
              <input type="number" id="min-duration" value="3.0" min="0.5" max="60" step="0.5" />
            </div>
          </div>
          <div class="field">
            <label for="codec">编码器</label>
            <select id="codec">
              <option value="libx264">libx264 (CPU)</option>
              <option value="h264_nvenc">h264_nvenc (NVIDIA GPU)</option>
            </select>
          </div>
          <div class="field">
            <label for="preset">编码预设</label>
            <select id="preset">
              <option value="ultrafast">ultrafast</option>
              <option value="fast" selected>fast</option>
              <option value="medium">medium</option>
              <option value="slow">slow</option>
            </select>
          </div>
          <div class="field full">
            <label for="output">输出文件</label>
            <div class="output-wrap">
              <input type="text" id="output" value="output.mp4" />
              <button class="glass-btn icon-btn" id="btn-output" title="选择保存位置">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12.25 8.75v3.5a1.17 1.17 0 01-1.17 1.17H2.92a1.17 1.17 0 01-1.17-1.17v-3.5M9.92 3.5L7 .58 4.08 3.5M7 .58v8.17"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Action + Progress -->
    <div class="glass-card glass-animate-in" style="animation-delay:150ms">
      <div class="action-bar">
        <div class="action-left">
          <div class="status-msg" id="status-msg"></div>
          <div class="progress-section" id="progress-section">
            <div class="progress-info">
              <span class="progress-text" id="progress-text">准备中...</span>
              <span class="progress-pct" id="progress-pct"></span>
            </div>
            <div class="progress-bar-track">
              <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
          </div>
        </div>
        <button class="glass-btn primary" id="btn-start">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>
          <span>开始处理</span>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
